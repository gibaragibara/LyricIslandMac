name: Release DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Show tool versions
        run: |
          swift --version
          dotnet --info

      - name: Make scripts executable
        run: chmod +x scripts/build_app.sh scripts/build_dmg.sh

      - name: Build DMG
        run: ./scripts/build_dmg.sh

      - name: Prepare release asset
        run: |
          mkdir -p release-assets
          cp "dist/LyricIslandMac.dmg" "release-assets/LyricIslandMac-${GITHUB_REF_NAME}.dmg"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LyricIslandMac-dmg
          path: release-assets/LyricIslandMac-${{ github.ref_name }}.dmg

      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/LyricIslandMac-${{ github.ref_name }}.dmg
          generate_release_notes: true
